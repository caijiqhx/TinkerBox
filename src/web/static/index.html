<!DOCTYPE html>
<html lang="zh-CN" data-theme-pref="__THEME_PREF_PLACEHOLDER__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具箱</title>
<script>
/* 主题在任何样式生效之前就定下来，避免"先白后黑"的闪烁。
   偏好（light / dark / auto）由服务端注入到 <html data-theme-pref>；
   这里把 auto 解析成实际值后写到 data-theme，CSS 只认 data-theme。 */
(function () {
  var root = document.documentElement;
  var pref = root.getAttribute("data-theme-pref") || "auto";
  if (pref !== "light" && pref !== "dark") { pref = "auto"; }
  var dark = pref === "dark";
  if (pref === "auto" && window.matchMedia) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  root.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark">◧</span>
      <span class="brand-name">工具箱</span>
    </div>

    <nav id="nav">
      <a class="nav-item" href="#/" data-route="/">
        <span class="nav-icon">⌂</span><span>首页</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <button id="btn-theme" class="btn ghost block" title="点击切换：浅色 / 深色 / 跟随系统">
        主题：跟随系统
      </button>
      <button id="btn-doctor" class="btn ghost block">环境自检</button>
      <button id="btn-quit" class="btn ghost block danger">退出程序</button>
      <div class="version" id="version"></div>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div id="toast" class="toast"></div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modal-title">提示</span>
      <button id="modal-close" class="btn ghost icon">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>window.__TOOLBOX_TOKEN__ = "__TOKEN_PLACEHOLDER__";</script>
<script src="/static/app.js"></script>
<script src="/static/tools/todo.js"></script>
</body>
</html>
